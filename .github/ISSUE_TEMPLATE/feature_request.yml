name: Feature request
description: Propose a change to a tool, a parameter, or a flag.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What task is hard or costly today? Name the tools you call now and how many calls or tokens it takes.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed tool or parameter change
      description: The tool, the new or changed parameter, and a sample call in JSON.
    validations:
      required: true
  - type: textarea
    id: effect
    attributes:
      label: Expected effect on tool calls or tokens
      description: Fewer calls, smaller results, or both. Every byte of tool schema is sent each turn, so also say how much schema the change adds.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives tried
      description: What you can do today with the existing tools.
